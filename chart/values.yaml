image:
  repository: ghcr.io/dodolia907/ra-prefix-controller
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# NIC that receives RAs. Required.
interface: ""

pool:
  name: ipv6-ndp-pool-gua
  hostPart: "::beef:0"
  prefixLength: 112
  serviceSelector:
    io.cilium/lb-pool: gua

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    memory: 48Mi

nodeSelector: {}
tolerations: []
